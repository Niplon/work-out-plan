<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plank Plan</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plank Plan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: single mobile column of cards; today's session first, progress after. Timer is a full-screen overlay. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d6dce3;
  --accent:#2450c9; --accent-soft:#e3eafb; --rest:#b86e00; --rest-soft:#fbefdc;
  --good:#1d8a5a; --good-soft:#dff3e9;
  --display:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151c; --surface:#18212b; --ink:#e8edf2; --muted:#93a1b0; --line:#2a3644;
    --accent:#7b9dff; --accent-soft:#1d2a4a; --rest:#f0a53a; --rest-soft:#3a2b14;
    --good:#43c08a; --good-soft:#153326; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --ink:#e8edf2; --muted:#93a1b0; --line:#2a3644;
  --accent:#7b9dff; --accent-soft:#1d2a4a; --rest:#f0a53a; --rest-soft:#3a2b14;
  --good:#43c08a; --good-soft:#153326; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;line-height:1.1;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tile .n{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-size:18px;padding:14px;width:100%;font-family:var(--display);letter-spacing:.03em}
:root[data-theme="dark"] button.primary{color:#0f151c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#0f151c}}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 4px}
button.danger{color:#c2372b}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--rest-soft);color:var(--rest)}
.banner{background:var(--rest-soft);border:1px solid transparent;border-left:4px solid var(--rest);border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .top b{font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:999px}
.fill.done{background:var(--good)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid{display:grid;grid-template-columns:auto repeat(7,1fr);gap:5px;align-items:center}
.grid .wk{font-size:12px;color:var(--muted);padding-right:4px;font-variant-numeric:tabular-nums}
.cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:transparent;padding:0;min-width:0}
.cell.done{background:var(--good);border-color:var(--good)}
.cell.test{box-shadow:inset 0 0 0 2px var(--rest)}
.cell.today{outline:2px solid var(--accent);outline-offset:1px}
.cell.future{opacity:.45;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}
ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.testrow{display:grid;grid-template-columns:1fr auto 92px;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.testrow:first-of-type{border-top:0;padding-top:0}
.testrow input{font:inherit;font-size:20px;font-weight:600;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.testrow label{font-weight:600}
.sw-btn.running{background:var(--rest-soft);border-color:var(--rest);color:var(--rest)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,20,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal{background:var(--surface);border-radius:14px;padding:18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}

/* Timer overlay */
.timer{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 16px;background:var(--bg);text-align:center}
.timer.hold{background:var(--accent-soft)}
.timer.rest{background:var(--rest-soft)}
.timer .what{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.05;margin:6px 0 4px;text-wrap:balance}
.timer.hold .what{color:var(--accent)}
.timer.rest .what{color:var(--rest)}
.ring{position:relative;width:min(72vw,300px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.timer.rest .ring .fg{stroke:var(--rest)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:min(22vw,92px);font-variant-numeric:tabular-nums}
.timer .controls{display:flex;gap:10px;width:100%;max-width:420px}
.timer .controls button{flex:1;padding:14px 8px}
@media (prefers-reduced-motion: reduce){.ring .fg{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Plank Plan</h1>
      <div class="sub">12 weeks · goal: 2:00 front, 1:00 each side</div>
    </div>
    <span class="chip" id="sync">Saved on this device</span>
  </header>
  <main id="app" style="display:flex;flex-direction:column;gap:14px"></main>
</div>
<div id="overlay"></div>

<script>
(function(){
"use strict";
const GOAL = {f:120, l:60, r:60};
const NAMES = {f:"Front plank", l:"Side plank (left)", r:"Side plank (right)"};
const SHORT = {f:"Front", l:"Side L", r:"Side R"};
const PCT = [0.5, 0.675, 0.775];
const LS_KEY = "plank-plan-v1";

/* ---------- state ---------- */
let state = blank();
let ui = {view:"home", rounds:3, testMode:"due", sw:null};
function blank(){ return {start:null, tests:[], log:{}, rest:45, adj:0, updated:0}; }

/* ---------- dates ---------- */
function keyOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayKey(){ return keyOf(new Date()); }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function diffDays(a,b){ const A=parseKey(a),B=parseKey(b); return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate())-Date.UTC(A.getFullYear(),A.getMonth(),A.getDate()))/864e5); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); }
function fmt(s){ s=Math.max(0,Math.round(s)); return s>=60 ? Math.floor(s/60)+":"+String(s%60).padStart(2,"0") : s+"s"; }
function fmtClock(s){ s=Math.max(0,Math.ceil(s)); return s>=60 ? Math.floor(s/60)+":"+String(s%60).padStart(2,"0") : String(s); }
function nice(k){ return parseKey(k).toLocaleDateString(undefined,{day:"numeric",month:"short"}); }

/* ---------- plan logic ---------- */
function dayIndex(){ return state.start ? diffDays(state.start, todayKey()) : -1; }
function weekNum(){ if(!state.start) return 0; return Math.min(12, Math.max(1, Math.floor(dayIndex()/7)+1)); }
function latestTest(){ return state.tests.length ? state.tests[state.tests.length-1] : null; }
function refTest(phase){
  const cutoff=(phase-1)*4; let ref=null;
  for(const t of state.tests){ if(t.week<=cutoff) ref=t; }
  return ref || state.tests[0];
}
function targets(){
  const w=weekNum(); if(!w) return null;
  const p=Math.ceil(w/4), inPhase=(w-1)%4, ref=refTest(p), out={};
  for(const k of ["f","l","r"]){
    let v=ref[k]*PCT[p-1] + 5*inPhase + (state.adj||0);
    v=Math.round(v/5)*5; out[k]=Math.max(10,v);
  }
  return {week:w, phase:p, ...out};
}
function dueTest(){
  if(!state.tests.length) return 0;
  const d=dayIndex();
  for(const wk of [4,8,12]){
    if(d >= wk*7-1 && !state.tests.some(t=>t.week===wk)) return wk;
  }
  return null;
}
function streak(){
  let k=todayKey(); if(!state.log[k]) k=addDays(k,-1);
  let n=0; while(state.log[k]){ n++; k=addDays(k,-1); }
  return n;
}
function thisWeekCount(){
  if(!state.start) return 0;
  const w=weekNum(); const s=dayIndex()>=84 ? addDays(todayKey(),-6) : addDays(state.start,(w-1)*7); let n=0;
  for(let i=0;i<7;i++) if(state.log[addDays(s,i)]) n++;
  return n;
}

/* ---------- storage ---------- */
let docRef=null, writing=Promise.resolve();
function loadLocal(){ try{ const s=localStorage.getItem(LS_KEY); if(s) return JSON.parse(s); }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function save(){
  state.updated=Date.now(); saveLocal();
  if(docRef){
    const snap=JSON.parse(JSON.stringify(state));
    writing=writing.then(()=>docRef.set(snap)).then(()=>setSync(true)).catch(()=>setSync(false));
  }
}
function setSync(ok){ document.getElementById("sync").textContent = ok ? "Synced to your account" : "Saved on this device"; }
function sane(s){ return s && typeof s==="object" && Array.isArray(s.tests) && s.log && typeof s.log==="object"; }

const local=loadLocal(); if(sane(local)) state=Object.assign(blank(),local);

(async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [d,u]=await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    docRef=d.doc("data/users/"+id+"/plank");
    const timeout=new Promise(r=>setTimeout(()=>r(null),10000));
    const snap=await Promise.race([docRef.get(), timeout]);
    if(!snap){ docRef=null; return; }
    const remote = snap.exists ? snap.data() : null;
    if(sane(remote) && (remote.updated||0) >= (state.updated||0)){
      state=Object.assign(blank(), JSON.parse(JSON.stringify(remote))); saveLocal(); setSync(true); render();
    } else if(state.tests.length){
      await docRef.set(JSON.parse(JSON.stringify(state))); setSync(true);
    } else { setSync(true); }
  }catch(e){ docRef=null; }
})();

/* ---------- render ---------- */
const app=document.getElementById("app");
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function thumbCard(){
  return `<section class="card" aria-labelledby="tips-h">
    <h2 id="tips-h">Protect the thumb</h2>
    <ul class="tips small">
      <li>Forearms down, hands open and relaxed. No fist, no clasped hands.</li>
      <li>Side plank on the sore side: weight on forearm and elbow, hand resting loose.</li>
      <li>No high planks or push-ups until it heals.</li>
      <li>Get down and up via knees and forearms, not by pushing on your hands.</li>
      <li>Throbs during a hold or aches more afterward? Swap in dead bugs for that week.</li>
    </ul>
  </section>`;
}

function render(){
  if(ui.view==="test"){ app.innerHTML=testView(); bindTest(); return; }
  if(!state.tests.length){ app.innerHTML=setupView(); bind(); return; }
  app.innerHTML=homeView(); bind();
}

function setupView(){
  return `<section class="card">
    <div class="eyebrow">Day 1</div>
    <h2>Start with a test</h2>
    <p class="small" style="margin:0">Time your best clean hold for each plank. Stop the moment your hips sag or twist. Rest 2–3 minutes between holds. Your daily targets are built from these numbers.</p>
    <button class="primary" data-act="test">Take the day-1 test</button>
  </section>
  <section class="card">
    <h2>How the 12 weeks work</h2>
    <table>
      <thead><tr><th>Weeks</th><th>Hold length</th><th>Each week</th></tr></thead>
      <tbody>
        <tr><td>1–4</td><td>50% of your test</td><td>+5 s</td></tr>
        <tr><td>5–8</td><td>~67% of your week-4 test</td><td>+5 s</td></tr>
        <tr><td>9–12</td><td>~78% of your week-8 test</td><td>+5 s</td></tr>
      </tbody>
    </table>
    <p class="small muted" style="margin:0">Daily: 3 rounds of front, side left, side right, about 8 minutes, 5–6 days a week. Busy day? One round still counts.</p>
  </section>
  ${thumbCard()}`;
}

function homeView(){
  const t=targets(), due=dueTest(), today=todayKey(), doneToday=!!state.log[today];
  const d=dayIndex(), finished=d>=84;
  const estMin=Math.round(((t.f+t.l+t.r)*ui.rounds + state.rest*(3*ui.rounds-1) + 10)/60);
  let out="";
  if(due){
    out+=`<div class="banner"><div><b>Week ${due} retest is due.</b><div class="small">${due===12?"Final test: see how close you got to the goal.":"New numbers set your targets for the next phase."}</div></div><button data-act="test">Retest now</button></div>`;
  }
  out+=`<section class="card" aria-labelledby="today-h">
    <div class="row between">
      <div class="eyebrow">${finished?"Plan complete · keep going":"Week "+t.week+" of 12 · Phase "+t.phase}</div>
      ${doneToday?`<span class="pill good">Done today</span>`:``}
    </div>
    <h2 id="today-h">Today's holds</h2>
    <div class="tiles">
      <div class="tile"><span class="n">${fmt(t.f)}</span><span class="l">Front</span></div>
      <div class="tile"><span class="n">${fmt(t.l)}</span><span class="l">Side left</span></div>
      <div class="tile"><span class="n">${fmt(t.r)}</span><span class="l">Side right</span></div>
    </div>
    <div class="row between small">
      <div class="row"><span class="muted">Rounds</span>
        <div class="seg" role="group" aria-label="Rounds">
          <button data-rounds="3" aria-pressed="${ui.rounds===3}">3</button>
          <button data-rounds="2" aria-pressed="${ui.rounds===2}">2</button>
          <button data-rounds="1" aria-pressed="${ui.rounds===1}">1 · busy day</button>
        </div>
      </div>
    </div>
    <div class="row small"><span class="muted">Rest</span>
      <div class="seg" role="group" aria-label="Rest between holds">
        ${[30,45,60].map(s=>`<button data-rest="${s}" aria-pressed="${state.rest===s}">${s}s</button>`).join("")}
      </div>
    </div>
    <button class="primary" data-act="start">${doneToday?"Do another session":"Start session"} · ~${estMin} min</button>
    <div class="row between small">
      <span class="muted">Too hard or too easy?${state.adj?` Adjusted ${state.adj>0?"+":""}${state.adj}s.`:""}</span>
      <div class="row">
        <button class="ghost" data-adj="-5">Easier −5s</button>
        <button class="ghost" data-adj="5">Harder +5s</button>
      </div>
    </div>
  </section>`;

  const bars=["f","l","r"].map(k=>{
    const best=Math.max(...state.tests.map(x=>x[k]||0)); const pct=Math.min(100,best/GOAL[k]*100);
    return `<div class="bar"><div class="top"><span>${NAMES[k]}</span><b>${fmt(best)} / ${fmt(GOAL[k])}</b></div><div class="track"><div class="fill ${pct>=100?"done":""}" style="width:${pct}%"></div></div></div>`;
  }).join("");
  out+=`<section class="card" aria-labelledby="prog-h">
    <h2 id="prog-h">Progress to goal</h2>
    <div class="stats">
      <div class="tile"><span class="n">${streak()}</span><span class="l">day streak</span></div>
      <div class="tile"><span class="n">${thisWeekCount()}<span class="muted" style="font-size:20px">/5</span></span><span class="l">sessions this week</span></div>
    </div>
    <div class="bars">${bars}</div>
    <p class="small muted" style="margin:0">Best test results so far. Retests at the end of weeks 4, 8 and 12.</p>
  </section>`;

  let cells="";
  for(let w=0;w<12;w++){
    cells+=`<span class="wk">W${w+1}</span>`;
    for(let i=0;i<7;i++){
      const k=addDays(state.start,w*7+i), di=w*7+i;
      const cls=["cell"]; if(state.log[k]) cls.push("done"); if(k===today) cls.push("today");
      if(state.tests.some(x=>x.date===k)) cls.push("test");
      const fut=di>d; if(fut) cls.push("future");
      cells+=`<button class="${cls.join(" ")}" data-day="${k}" ${fut?"disabled":""} aria-label="${nice(k)}${state.log[k]?", done":""}${fut?", upcoming":", tap to toggle"}"></button>`;
    }
  }
  out+=`<section class="card" aria-labelledby="cal-h">
    <div class="row between"><h2 id="cal-h">12 weeks</h2><span class="small muted">Started ${nice(state.start)}</span></div>
    <div class="grid">${cells}</div>
    <div class="legend"><span><i class="sw" style="background:var(--good);border-color:var(--good)"></i>Done</span><span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--rest)"></i>Test day</span><span>Tap a past day to log or unlog it</span></div>
  </section>`;

  out+=thumbCard();

  out+=`<section class="card" aria-labelledby="hist-h">
    <h2 id="hist-h">Test results</h2>
    <table><thead><tr><th>Test</th><th>Date</th><th>Front</th><th>Side L</th><th>Side R</th></tr></thead><tbody>
    ${state.tests.map(x=>`<tr><td>${x.week===0?"Day 1":"Week "+x.week}</td><td>${nice(x.date)}</td><td>${fmt(x.f)}</td><td>${fmt(x.l)}</td><td>${fmt(x.r)}</td></tr>`).join("")}
    </tbody></table>
    <div class="row between">
      <button class="ghost" data-act="redo">Redo latest test</button>
      <button class="ghost danger" data-act="reset">Reset everything</button>
    </div>
  </section>`;
  return out;
}

function bind(){
  app.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
    const a=b.dataset.act;
    if(a==="test"){ ui.view="test"; ui.testMode="due"; render(); window.scrollTo(0,0); }
    if(a==="redo"){ ui.view="test"; ui.testMode="redo"; render(); window.scrollTo(0,0); }
    if(a==="start") startSession();
    if(a==="reset") confirmBox("Reset everything?","This deletes your tests and logged days.","Reset",()=>{ state=blank(); save(); render(); });
  }));
  app.querySelectorAll("[data-rounds]").forEach(b=>b.addEventListener("click",()=>{ ui.rounds=+b.dataset.rounds; render(); }));
  app.querySelectorAll("[data-rest]").forEach(b=>b.addEventListener("click",()=>{ state.rest=+b.dataset.rest; save(); render(); }));
  app.querySelectorAll("[data-adj]").forEach(b=>b.addEventListener("click",()=>{ state.adj=Math.max(-30,Math.min(30,(state.adj||0)+ +b.dataset.adj)); save(); render(); }));
  app.querySelectorAll("[data-day]").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.day; if(state.log[k]) delete state.log[k]; else state.log[k]=3; save(); render(); }));
}

/* ---------- test view ---------- */
function testView(){
  const redo=ui.testMode==="redo", lt=latestTest();
  const wk = redo ? lt.week : (dueTest() ?? 0);
  const label = wk===0 ? "Day-1 test" : "Week "+wk+" retest";
  const pre = redo ? lt : {};
  return `<section class="card">
    <div class="row between"><div class="eyebrow">${redo?"Redo · ":""}${label}</div><button class="ghost" data-tact="back">Cancel</button></div>
    <h2>Time your best hold</h2>
    <p class="small" style="margin:0">Use the stopwatch or type the seconds. Stop when hips sag or twist. Rest 2–3 minutes between holds. Forearms down, hands open.</p>
    ${["f","l","r"].map(k=>`<div class="testrow">
      <label for="in-${k}">${NAMES[k]}</label>
      <button class="sw-btn" data-sw="${k}">Stopwatch</button>
      <input id="in-${k}" inputmode="numeric" placeholder="sec" value="${pre[k]??""}" aria-label="${NAMES[k]} seconds">
    </div>`).join("")}
    <p class="small muted" id="terr" style="margin:0" role="status"></p>
    <button class="primary" data-tact="save">Save results</button>
  </section>
  ${thumbCard()}`;
}
function parseSec(v){
  v=String(v).trim(); if(!v) return NaN;
  if(v.includes(":")){ const [m,s]=v.split(":").map(Number); return m*60+(s||0); }
  return Number(v);
}
function bindTest(){
  app.querySelectorAll("[data-tact]").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.tact==="back"){ stopSW(); ui.view="home"; render(); return; }
    stopSW();
    const vals={}; for(const k of ["f","l","r"]){ const n=parseSec(document.getElementById("in-"+k).value); if(!(n>0&&n<1800)){ document.getElementById("terr").textContent="Enter a time for all three holds, in seconds (e.g. 45) or m:ss (e.g. 1:10)."; return; } vals[k]=Math.round(n); }
    const today=todayKey();
    if(ui.testMode==="redo"){ Object.assign(state.tests[state.tests.length-1], vals); }
    else {
      const wk=dueTest() ?? 0;
      if(!state.tests.length){ state.start=today; }
      state.tests.push({week:wk, date:today, ...vals});
    }
    save(); ui.view="home"; render(); window.scrollTo(0,0);
  }));
  app.querySelectorAll("[data-sw]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.sw;
    if(ui.sw && ui.sw.k===k){ stopSW(); return; }
    stopSW(); unlockAudio();
    const input=document.getElementById("in-"+k), t0=performance.now();
    b.classList.add("running"); b.textContent="Stop";
    const iv=setInterval(()=>{ input.value=Math.floor((performance.now()-t0)/1000); },200);
    ui.sw={k,iv,b}; beep(880,.12);
  }));
}
function stopSW(){ if(!ui.sw) return; clearInterval(ui.sw.iv); ui.sw.b.classList.remove("running"); ui.sw.b.textContent="Stopwatch"; ui.sw=null; beep(520,.2); }

/* ---------- modal ---------- */
function confirmBox(title,msg,okLabel,onOk){
  const ov=document.getElementById("overlay");
  ov.innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${esc(title)}</h2><p class="small" style="margin:0">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button id="m-no">Cancel</button><button id="m-ok" class="danger">${esc(okLabel)}</button></div></div></div>`;
  const prev=document.activeElement;
  const close=()=>{ ov.innerHTML=""; if(prev && prev.isConnected) prev.focus(); };
  ov.querySelector("#m-no").onclick=close;
  ov.querySelector("#m-ok").onclick=()=>{ close(); onOk(); };
  ov.querySelector("#m-no").focus();
}
document.addEventListener("keydown",e=>{
  const dlg=document.querySelector("#overlay [role=dialog]"); if(!dlg) return;
  if(e.key==="Escape"){
    const btn=dlg.querySelector("#m-no, #dn-ok, #t-pause");
    if(btn){ e.preventDefault(); btn.click(); }
    return;
  }
  if(e.key==="Tab"){
    const f=[...dlg.querySelectorAll("button:not([disabled])")]; if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(!dlg.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
    else if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

/* ---------- audio ---------- */
let ac=null;
function unlockAudio(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }catch(e){ ac=null; } }
function beep(freq,dur){ try{ if(!ac) return; const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=freq; o.connect(g); g.connect(ac.destination); const t=ac.currentTime; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.3,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur+.02); }catch(e){} }
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* ---------- session timer ---------- */
let sess=null, wake=null;
function buildSteps(){
  const t=targets(), R=ui.rounds, steps=[{kind:"rest",label:"Get into position",sec:10,round:1}];
  for(let r=1;r<=R;r++){
    ["f","l","r"].forEach((k,i)=>{
      steps.push({kind:"hold",label:NAMES[k],sec:t[k],round:r,k});
      const last = r===R && i===2;
      if(!last) steps.push({kind:"rest",label:"Rest",sec:state.rest,round:r});
    });
  }
  return steps;
}
async function startSession(){
  unlockAudio();
  try{ if(navigator.wakeLock) wake=await navigator.wakeLock.request("screen"); }catch(e){ wake=null; }
  sess={steps:buildSteps(), i:0, paused:false, endAt:0, left:0, iv:null, lastBeep:null, done:0};
  beginStep();
  sess.iv=setInterval(tick,100);
}
function nextHoldName(){ for(let j=sess.i+1;j<sess.steps.length;j++){ if(sess.steps[j].kind==="hold") return sess.steps[j].label; } return null; }
function beginStep(){
  const s=sess.steps[sess.i]; sess.endAt=performance.now()+s.sec*1000; sess.left=s.sec; sess.lastBeep=null;
  if(s.kind==="hold"){ beep(988,.25); buzz(200); } else if(sess.i>0){ beep(660,.25); buzz([80,60,80]); }
  drawTimer();
}
function tick(){
  if(!sess||sess.paused) return;
  const left=(sess.endAt-performance.now())/1000; sess.left=left;
  const whole=Math.ceil(left);
  if(whole<=3 && whole>=1 && sess.lastBeep!==whole){ sess.lastBeep=whole; beep(740,.08); }
  if(left<=0){ if(sess.steps[sess.i].kind==="hold") sess.done++; sess.i++; if(sess.i>=sess.steps.length){ finish(true); return; } beginStep(); return; }
  updateTimer();
}
function drawTimer(){
  const s=sess.steps[sess.i], R=ui.rounds, nxt=nextHoldName();
  const cue = s.kind==="hold" ? "Forearms down · hands open · hips level" : (nxt ? "Next: "+nxt : "");
  document.getElementById("overlay").innerHTML=`<div class="timer ${s.kind}" role="dialog" aria-modal="true" aria-label="Session timer">
    <div>
      <div class="eyebrow">Round ${Math.min(s.round,R)} of ${R}</div>
      <div class="what" id="t-what">${esc(s.label)}</div>
      <div class="small muted" id="t-cue">${esc(cue)}</div>
    </div>
    <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bgc" cx="60" cy="60" r="52"/><circle class="fg" id="t-fg" cx="60" cy="60" r="52" stroke-dasharray="326.73" stroke-dashoffset="0"/></svg><div class="num" id="t-num" aria-live="off">${fmtClock(s.sec)}</div></div>
    <div class="controls">
      <button id="t-end">End</button>
      <button id="t-pause">${sess.paused?"Resume":"Pause"}</button>
      <button id="t-skip">Skip</button>
    </div>
  </div>`;
  document.getElementById("t-end").onclick=()=>finish(false);
  document.getElementById("t-skip").onclick=()=>{ sess.i++; if(sess.i>=sess.steps.length){ finish(true); return; } sess.paused=false; beginStep(); };
  document.getElementById("t-pause").onclick=()=>{
    if(sess.paused){ sess.paused=false; sess.endAt=performance.now()+sess.left*1000; }
    else { sess.paused=true; sess.left=(sess.endAt-performance.now())/1000; }
    document.getElementById("t-pause").textContent=sess.paused?"Resume":"Pause";
  };
  document.getElementById("t-pause").focus();
  updateTimer();
}
function updateTimer(){
  const s=sess.steps[sess.i]; const n=document.getElementById("t-num"), fg=document.getElementById("t-fg");
  if(!n) return;
  n.textContent=fmtClock(sess.left);
  const frac=Math.max(0,Math.min(1,1-sess.left/s.sec)); fg.setAttribute("stroke-dashoffset",(326.73*frac).toFixed(1));
}
function finish(complete){
  clearInterval(sess.iv);
  const holdsDone=sess.done;
  sess=null; try{ wake && wake.release(); }catch(e){} wake=null;
  const ov=document.getElementById("overlay");
  if(holdsDone>=3){
    const k=todayKey(); state.log[k]=Math.max(state.log[k]||0, Math.floor(holdsDone/3)); save();
    beep(1175,.35); buzz([100,80,100,80,200]);
    ov.innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dn"><span class="pill good" style="align-self:flex-start">Logged</span><h2 id="dn">Session done</h2><p class="small" style="margin:0">${Math.floor(holdsDone/3)} round${holdsDone>=6?"s":""} logged for today. Streak: ${streak()} day${streak()===1?"":"s"}. If the thumb aches more later, take tomorrow off planks.</p><button class="primary" id="dn-ok">Back to plan</button></div></div>`;
    ov.querySelector("#dn-ok").onclick=()=>{ ov.innerHTML=""; render(); };
    ov.querySelector("#dn-ok").focus();
  } else { ov.innerHTML=""; render(); }
}

render();

/* ---------- offline / install ---------- */
try{ if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("/sw.js").catch(()=>{}); }catch(e){}
})();
</script>
